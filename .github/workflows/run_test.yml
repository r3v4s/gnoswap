name: run-test

on:
  pull_request:
    branches:
      - main

jobs:
  test-gno:
    runs-on: ubuntu-latest
    # fail-fast: false ensures that if one matrix entry fails,
    #            it doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        test-folder:
          - gno/examples/gno.land/p/gnoswap/uint256
          - gno/examples/gno.land/p/gnoswap/int256
          - gno/examples/gno.land/p/gnoswap/gnsmath

          - gno/examples/gno.land/r/gnoswap/v1/common
          - gno/examples/gno.land/r/gnoswap/v1/gns
          - gno/examples/gno.land/r/gnoswap/v1/gnft
          - gno/examples/gno.land/r/gnoswap/v1/gov/xgns
          - gno/examples/gno.land/r/gnoswap/v1/emission
          - gno/examples/gno.land/r/gnoswap/v1/protocol_fee
          - gno/examples/gno.land/r/gnoswap/v1/pool
          - gno/examples/gno.land/r/gnoswap/v1/position
          - gno/examples/gno.land/r/gnoswap/v1/router
          - gno/examples/gno.land/r/gnoswap/v1/staker
          - gno/examples/gno.land/r/gnoswap/v1/community_pool
          - gno/examples/gno.land/r/gnoswap/v1/gov/staker
          - gno/examples/gno.land/r/gnoswap/v1/gov/governance
          - gno/examples/gno.land/r/gnoswap/v1/launchpad

    steps:
      # 1. Check out gnoswap repository (with your workflow file, etc.)
      - name: Check out gnoswap repo
        uses: actions/checkout@v4

      # 2. Check out gno(master) into ./gno
      - name: Check out gno(master)
        uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          ref: master # can be used with tag also (e.g `chain/test5.0`)
          path: ./gno

      # 3. Install Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 4. Configure gnovm
      - name: Config gnovm
        run: |
          sed -i 's/ctx.Timestamp += (count \* 5)/ctx.Timestamp += (count \* 2)/g' ./gno/gnovm/tests/stdlibs/std/std.go

      # 5. Build/install `gno` CLI
      - name: Install gno
        run: |
          cd gno
          make install.gno

      # 6. Set up Python
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # 7. Check out your gnoswap repo into ./tmp/gnoswap
      - name: Checkout gnoswap(main)
        uses: actions/checkout@v4
        with:
          path: ./tmp/gnoswap

      # 8. Run setup.py (copy contracts into gno)
      - name: Run setup.py
        run: |
          cd tmp/gnoswap
          python3 setup.py -w /home/runner/work/gnoswap/gnoswap

      # 9. Now run the tests in parallel via the matrix.
      #    Each job will handle ONE "test-folder" from the matrix.
      - name: "Run unit tests for ${{ matrix.test-folder }}"
        # if any test fails, we keep going to test all folders:
        continue-on-error: true
        run: |
          # 1) Run the "bulk" unit tests
          gno test ./${{ matrix.test-folder }} \
            -root-dir /home/runner/work/gnoswap/gnoswap/gno -v

          # 2) Remove all _test.gno except _helper_test.gno
          find ./${{ matrix.test-folder }} -type f -name "*_test.gno" \
            ! -name "_helper_test.gno" \
            -exec rm -f {} +

          # 3) One-by-one tests: rename *.gnoA => *.gno, run, revert
          cd ./${{ matrix.test-folder }}
          TESTFILES=$(ls | grep '_test.gnoA$' || true)
          for f in $TESTFILES; do
            base="${f%.gnoA}"
            mv "$f" "$base.gno"

            gno test . \
              -root-dir /home/runner/work/gnoswap/gnoswap/gno -v

            mv "$base.gno" "$f"
          done
