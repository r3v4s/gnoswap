name: run-test

on:
  pull_request:
    branches:
      - main

jobs:
  run-test:
    continue-on-error: true
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Check gno(master)
        uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          ref: master
          path: ./gno

      - name: Config gnovm
        run: |
          sed -i 's/ctx.Timestamp += (count \* 5)/ctx.Timestamp += (count \* 2)/g' ./gno/gnovm/tests/stdlibs/std/std.go

      - name: Install `gno`
        run: |
          cd gno
          make install.gno

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Checkout gnoswap(main)
        uses: actions/checkout@v4
        with:
          path: ./tmp/gnoswap

      - name: Run setup.py to copy contracts into gno
        run: |
          cd tmp/gnoswap
          python3 setup.py -w /home/runner/work/gnoswap/gnoswap

