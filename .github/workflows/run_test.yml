name: run-test

on:
  pull_request:
    branches:
      - main

jobs:
  run-test:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: checkout gno
        uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          ref: master
          path: ./gno

      - name: change block time to 2s
        run: |
          sed -i 's/ctx.Timestamp += (count \* 5)/ctx.Timestamp += (count \* 2)/g' ./gno/gnovm/tests/stdlibs/std/std.go

      - name: build gno
        run: |
          cd gno/gnovm
          make install

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: checkout code
        uses: actions/checkout@v4

      - name: run setup.py to copy contracts
        run: |
          python3 setup.py

      - name: prepare `emission` tests
        run: |
          cd /home/runner/gno/examples/gno.land/r/gnoswap/v1/emission
          for f in *_test.gno; do
            [ -e "$f" ] || continue

            if [ "$f" == "_helper_test.gno" ]; then
              continue
            fi

            mv "$f" "${f}A"
          done

      - name: run `emission` tests one by one
        run: |
          cd /home/runner/gno/examples/gno.land/r/gnoswap/v1/emission
          TESTFILES=$(ls | grep '_test.gnoA$' || true)

          for f in $TESTFILES; do
            base="${f%.gnoA}"

            echo "---------------------------------------------------"
            echo "Renaming $f → $base"
            mv "$f" "$base"

            echo "Running 'gno test' for: $base"
            gno test ./ -root-dir /home/runner/gno
            # go run ~/gno/gnovm/cmd/gno test ./ -root-dir /home/runner/gno
            echo "Finished tests for: $base"
            echo "---------------------------------------------------"

            echo "Reverting $base → $f"
            mv "$base" "$f"
          done
